<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Hallo Hi Abonnementenoverzicht</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: white;
            margin: 30px;
        }

        table {
            width: 700px;
            border-spacing: 0;
            border-radius: 70px;
            color: white;
        }

        th {
            background-color: #8988c2;
            padding: 18px;
            text-align: left;
        }

        td {
            background-color: black;
            padding: 12px 18px;
        }

        td:first-child {
            background-color: #5955c2;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Abonnement</th>
                <th>Snelheid (Mbps)</th>
                <th>Data</th>
                <th>Maandprijs</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Basic</td>
                <td>300mb/s</td>
                <td>2GB</td>
                <td>16,50</td>
            </tr>

            <tr>
                <td>Start</td>
                <td>300mb/s</td>
                <td>10GB</td>
                <td>18,00</td>
            </tr>

            <tr>
                <td>Unlimited</td>
                <td>400mb/s</td>
                <td>50GB</td>
                <td>32,50</td>
            </tr>

            <tr>
                <td>Unlimited Plus</td>
                <td>700mb/s</td>
                <td>60GB</td>
                <td>37,50</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
